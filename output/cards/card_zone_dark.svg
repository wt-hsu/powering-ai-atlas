01A2B"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#101A2B"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#101A2B"/><line x1="0" y1="540" x2="1200" y2="540" stroke="#101A2B"/><line x1="0" y1="600" x2="1200" y2="600" stroke="#101A2B"/><line x1="0" y1="660" x2="1200" y2="660" stroke="#101A2B"/><text x="64" y="88" font-size="34" fill="#E9F0F8" font-weight="700" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">需求擠在限制區</text><text x="64" y="118" font-size="15" fill="#00A3B8" font-weight="400" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" text-anchor="start" letter-spacing="2">DEMAND INSIDE THE MORATORIUM ZONE</text><text x="64" y="168" font-size="17" fill="#A9B8CC" font-weight="400" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">台電 2023-09 起不核供北北基桃 5MW+ 資料中心——但市場的落點沒有跟著政策走。</text><text x="64" y="240" font-size="19" fill="#E9F0F8" font-weight="500" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">北北基桃「暫緩供電區」內・8 案</text><rect x="64" y="256" width="598.9708737864078" height="64" rx="5" fill="#00A3B8"/><rect x="64" y="256" width="598.9708737864078" height="64" rx="5" fill="url(#hatch)"/><text x="680.9708737864078" y="298" font-size="30" fill="#E9F0F8" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" text-anchor="start">283MW</text><text x="64" y="400" font-size="19" fill="#E9F0F8" font-weight="500" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">限制區外・5 案</text><rect x="64" y="416" width="872" height="64" rx="5" fill="rgba(0,163,184,0.16)" stroke="#00A3B8" stroke-width="2"/><text x="954" y="458" font-size="30" fill="#E9F0F8" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" text-anchor="start">412MW+</text><text x="64" y="560" font-size="15" fill="#A9B8CC" font-weight="400" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">客戶、光纖與人才在哪,機房就想在哪——政策擋得住供電,擋不住選址。</text><text x="64" y="635" font-size="12.5" fill="#74869E" font-weight="400" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">口徑依個案(契約容量/最大負載/IT 負載),合計僅供量級參考;區外另有 1 案容量未揭露。</text><text x="64" y="653" font-size="12.5" fill="#74869E" font-weight="400" font-family="'Noto Sans TC','WenQuanYi Zen Hei',sans-serif" text-anchor="start">資料:公開報導與官方新聞稿彙整(來源見 DATA_AUDIT.md)|查核日 2026-08-26</text><text x="1136" y="653" font-size="13" fill="#74869E" font-weight="400" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" text-anchor="end">powering-ai-atlas</text></svg>